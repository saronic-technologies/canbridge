[package]
name = "canbridge"
version = "0.1.0"
edition = "2021"

[dependencies]
socketcan = "3.3"
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.0", features = ["use-std"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
libc = "0.2"
netlink-sys = "0.8"
# Must match the netlink-packet-core version netlink-packet-route depends on (0.23 -> core 0.7).
netlink-packet-core = "0.7"
netlink-packet-route = "0.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
