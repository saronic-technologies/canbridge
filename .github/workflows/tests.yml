name: cargo build, cargo test, nixos VM test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@v4
    - uses: DeterminateSystems/nix-installer-action@main
    - name: Build
      run: nix develop --command cargo build --locked --verbose
    - name: Run cargo tests
      run: nix develop --command cargo test --locked --verbose
    - name: Run NixOS VM test
      run: nix build -L .#canbridge-test
    - name: Run idle CAN failure regressions
      run: nix build -L .#canbridge-cleanup-listen-test .#canbridge-cleanup-connect-test

  build-status:
    name: build
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Require both architecture jobs to pass
      env:
        BUILD_RESULT: ${{ needs.build.result }}
      run: test "$BUILD_RESULT" = success
